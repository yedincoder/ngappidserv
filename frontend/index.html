<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>NgAppIDServ - Webserver Local Modern</title>
    <link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">

    <!-- Modal Pop-up (Tersembunyi secara default) -->
    <div id="infoModal">
        <div class="modal-content">
            <h3 id="modalTitle">Judul</h3>
            <div id="modalBody" class="modal-body">Isi konten...</div>
            <button id="btnCloseModal" class="btn-outline-modal">Tutup</button>
        </div>
    </div>

    <!-- HEADER SEJAJAR KIRI-KANAN -->
    <div class="header-container">
        <div class="header-left">
            <img src="icon.png" alt="Logo">
            <div>
                <h2>NgAppIDServ</h2>
                <div class="subtitle">Webserver Local Modern</div>
            </div>
        </div>
        <div class="header-right">
            <div class="version-text" id="appVersionText">Versi ...</div>
            <!-- Tombol Cek Update Manual -->
            <button id="btnCheckUpdate" class="btn-update">
                <span style="font-size: 10px; font-weight: 600;">✓</span> VERSI TERBARU
            </button>
        </div>
    </div>
    
    <!-- === BUNGKUSAN UTAMA 2 KOLOM === -->
    <div style="display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: stretch;">
        
        <!-- ======================= -->
        <!-- KOLOM KIRI (Server Core)-->
        <!-- ======================= -->
        <div style="display: flex; flex-direction: column; gap: 15px; min-width: 0;">
            <div class="panel" style="margin-bottom: 0;">
                
                <!-- PHP -->
                <div class="row" style="padding-top: 0;">
                    <div style="display: flex; gap: 10px;">
                        <button id="btnTogglePHP" class="btn-toggle btn-green">START PHP</button>
                        <div id="portWeb" title="Port Web (Ubah di Settings)" class="input-port" style="display: flex; align-items: center; justify-content: center; cursor: default;">80</div>
                    </div>
                    <div class="lampu-container">Nginx & PHP <span id="lampuWeb" class="lampu"></span></div>
                </div>
                
                <!-- MySQL -->
                <div class="row">
                    <div style="display: flex; gap: 10px;">
                        <button id="btnToggleDB" class="btn-toggle btn-green">START MYSQL</button>
                        <div id="portDB" title="Port MySQL (Ubah di Settings)" class="input-port" style="display: flex; align-items: center; justify-content: center; cursor: default;">3307</div>
                    </div>
                    <div class="lampu-container">MySQL Server <span id="lampuDB" class="lampu"></span></div>
                </div>
                
                <!-- PostgreSQL -->
                <div class="row">
                    <div style="display: flex; gap: 10px;">
                        <button id="btnTogglePgSQL" class="btn-toggle btn-green">START PGSQL</button>
                        <div id="portPgSQL" title="Port PostgreSQL (Ubah di Settings)" class="input-port" style="display: flex; align-items: center; justify-content: center; cursor: default;">5432</div>
                    </div>
                    <div class="lampu-container">PostgreSQL <span id="lampuPgSQL" class="lampu"></span></div>
                </div>
                
                <!-- Redis -->
                <div class="row">
                    <div style="display: flex; gap: 10px;">
                        <button id="btnToggleRedis" class="btn-toggle btn-green">START REDIS</button>
                    </div>
                    <div class="lampu-container">Redis Cache <span id="lampuRedis" class="lampu"></span></div>
                </div>
                
                <!-- Mail Catcher -->
                <div class="row">
                    <div style="display: flex; gap: 10px;">
                        <button id="btnToggleMail" class="btn-toggle btn-green">START MAIL</button>
                        <button id="btnMailpitLink" class="btn-outline-modal" style="display: none; padding: 0 10px; width: auto; font-size: 11px;" title="Buka Web UI Mailpit">📧 UI</button>
                    </div>
                    <div class="lampu-container">Mail Catcher <span id="lampuMail" class="lampu"></span></div>
                </div>
            
                <!-- Tunnel -->
                <!-- Tunnel Multi-Project -->
                <div class="row" style="border-bottom: none; padding-bottom: 0;">
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <button id="btnOpenTunnelModal" class="btn-toggle btn-green" style="width: 100%; justify-content: center;">🌐 BUKA MENU LIVE TUNNEL</button>
                    </div>
                </div>
    
            </div>
        </div>

        <!-- ======================= -->
        <!-- KOLOM KANAN (Tools & Log)-->
        <!-- ======================= -->
        <div style="display: flex; flex-direction: column; gap: 15px; min-width: 0;">
            
            <!-- Tombol Stop All -->
            <button id="btnStopAll">⭕ MATIKAN SEMUA</button>
            
            <!-- Grid 4x2 Tombol Navigasi -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px;">
                
                <button id="btnOpenProject" class="btn-grid btn-web">
                    <span>📁</span> Web Project
                </button>
                
                <button id="btnBackupDB" class="btn-grid btn-backup">
                    <span>💾</span> Backup DB
                </button>
                
                <button id="btnOpenPMA" class="btn-grid btn-pma">
                    <span>🗄️</span> <i id="textDBManager">PMA</i>
                </button>
                
                <button id="btnRebuildSSL" class="btn-grid btn-ssl">
                    <span>🔐</span> Rebuild SSL
                </button>

                <button id="btnInstaller" class="btn-grid btn-install">
                    <span>📦</span> Installer
                </button>

                <button id="btnVersions" class="btn-grid btn-versi">
                    <span>⚙️</span> Settings
                </button>

                <button id="btnConsoleMain" class="btn-grid btn-console">
                    <span>⌨️</span> Console
                </button>

                <button id="btnErrorLogs" class="btn-grid" style="border-color: #F44336; color: #F44336;">
                    <span>🐞</span> Error Logs
                </button>
            </div>
            
            <!-- Terminal Log -->
            <div id="statusBox" style="margin-top: 0; flex-grow: 1; min-height: 100px; max-height: 100px;">☕ Menunggu perintah...</div>
        </div>
        
    </div>

    <!-- Footer Links -->
    <div class="footer-links">
        <div class="footer-left">
            <span id="btnLisensi">👑 Dukungan</span>
            <span id="btnAbout">💡 About</span>
            <span id="btnReadme">📖 Readme</span>
            <span id="btnWebsite">🌐 Dev.NgAppID.com</span>
        </div>
        <div class="footer-right">
            &copy; 2026
        </div>
    </div>

    <script>
        // --- BRIDGE WAILS ---
        window.serverAPI = {
            start: (port) => window.go.main.App.Start(parseInt(port)),
            stop: () => window.go.main.App.Stop(),
            startDB: (port) => window.go.main.App.StartDB(parseInt(port)),
            stopDB: () => window.go.main.App.StopDB(),
            startRedis: () => window.go.main.App.StartRedis(),
            stopRedis: () => window.go.main.App.StopRedis(),
            startMail: () => window.go.main.App.StartMail(),
            stopMail: () => window.go.main.App.StopMail(),
            startTunnel: (data) => window.go.main.App.StartTunnel(data),
            stopTunnel: (domain) => window.go.main.App.StopTunnel(domain),
            stopAll: () => window.go.main.App.StopAll(),
            getAppVersion: async () => await window.go.main.App.GetAppVersion(),
            getSettings: async () => await window.go.main.App.GetSettings(),
            getVersions: async () => await window.go.main.App.GetVersions(),
            getProjects: async () => await window.go.main.App.GetProjects(),
            openFolder: (name) => window.go.main.App.OpenFolder(name),
            deleteProject: (name) => window.go.main.App.DeleteProject(name),
            openExternal: (url) => window.go.main.App.OpenExternal(url),
            openPMA: () => window.go.main.App.OpenPMA(),
            openCmdWWW: () => window.go.main.App.OpenCmdWWW(),
            openLog: (type) => window.go.main.App.OpenLog(type),
            backupDB: (port) => window.go.main.App.BackupDB(parseInt(port)),
            rebuildSSL: () => window.go.main.App.RebuildSSL(),
            installApp: (data) => window.go.main.App.InstallApp(data),
            saveSettings: async (data) => await window.go.main.App.SaveSettings(data),
            startPgSQL: (port) => window.go.main.App.StartPgSQL(parseInt(port)),
            stopPgSQL: () => window.go.main.App.StopPgSQL(),
            checkUpdate: () => {}, onUpdateAvailable: () => {}, onUpdateNotAvailable: () => {}, onUpdateError: () => {}
        };

        // --- LOGIKA MODAL & FOOTER LINKS ---
        const modal = document.getElementById('infoModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBody = document.getElementById('modalBody');
        
        window.addEventListener('DOMContentLoaded', async () => {
            const version = await window.serverAPI.getAppVersion();
            document.getElementById('appVersionText').innerText = `Versi ${version}`;
            
            // Ambil konfigurasi port dari setting.ini lewat backend
            try {
                if (window.serverAPI.getSettings) {
                    const cfg = await window.serverAPI.getSettings();
                    // Terapkan ke innerText karena sekarang div/span
                    if (cfg.web_port) document.getElementById('portWeb').innerText = cfg.web_port;
                    if (cfg.db_port) document.getElementById('portDB').innerText = cfg.db_port;
                    if (cfg.pgsql_port) document.getElementById('portPgSQL').innerText = cfg.pgsql_port;
                    
                    // Ganti teks tombol DB Manager saat awal load
                    if (cfg.db_manager) {
                        const textPMA = document.getElementById('textDBManager');
                       if (textPMA) textPMA.innerText = (cfg.db_manager === 'ngappidmydb') ? 'NgMyDB' : (cfg.db_manager === 'phpmyadmin' ? 'PMA' : 'Adminer');
                    }
                }
            } catch (e) {
                console.log("Menggunakan port default fallback.");
            }
            
            const tunnelInput = document.getElementById('tunnelDomain');
            if (tunnelInput) {
                tunnelInput.disabled = false;
                tunnelInput.style.cursor = 'text';
                tunnelInput.style.opacity = '1';
                tunnelInput.title = 'Ketik Domain Project';
            }
        });

    document.addEventListener('contextmenu', event => event.preventDefault());
        
        // --- BUKA JENDELA INFO DONASI (OPEN SOURCE MODE) ---
        document.getElementById('btnLisensi').addEventListener('click', () => {
            document.querySelector('.modal-content').style.maxWidth = '80%';
            
            modalTitle.innerText = '☕ Dukung Pengembangan NgAppIDServ';
            
            modalBody.innerHTML = `
                <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 15px; align-items: center;">
                    
                    <!-- KOLOM KIRI: Info & Teks -->
                    <div style="text-align: left;">
                        <div style="font-size: 35px; margin-bottom: 5px;">🚀</div>
                        <div style="color: var(--green-start); font-weight: bold; font-size: 14px;">100% Gratis & Terbuka!</div>
                        <div style="font-size: 11px; color: var(--text-muted); margin-top: 5px; line-height: 1.6; margin-bottom: 15px;">
                            Seluruh fitur premium telah dibuka. Jika aplikasi ini mempercepat kerjaanmu, dukunganmu akan sangat membantu pengembangan fitur selanjutnya.
                        </div>
                                                                                                                
                        <div style="margin-top: 15px; font-size: 10px; color: #666; font-style: italic;">
                            "Terima kasih banyak atas dukungan para Developer Indonesia!" 🙏
                        </div>
                    </div>
                    
                    <!-- KOLOM KANAN: Gambar QRIS -->
                    <div style="text-align: center; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #ccc;">
                        <b style="color: #333; font-size: 11px; display: block; margin-bottom: 8px;">Scan QRIS di sini:</b>
                        <img src="qris.png" alt="QRIS Donasi" style="max-width: 100%; height: auto; max-height: 190px; display: block; margin: 0 auto; border-radius: 4px;">
                    </div>
                    
                </div>
            `;
            modal.style.display = 'flex';
        });

     // --- LOGIKA TOMBOL INFO VERSI (Single Engine + Download Link + Port Settings) ---
        document.getElementById('btnVersions').addEventListener('click', async () => {
            document.querySelector('.modal-content').style.maxWidth = '90%'; 
            
            modalTitle.innerText = '⏳ Mengambil Data...';
            modalBody.innerHTML = '<div style="text-align:center; padding: 20px;">Memindai konfigurasi engine lokal...</div>';
            modal.style.display = 'flex';
            
            const versions = await window.serverAPI.getVersions();
            
            const getActiveVersion = (dataList) => {
                if (!Array.isArray(dataList)) return '-';
                const activeItem = dataList.find(item => item.isDefault);
                return activeItem ? `v${activeItem.versi}` : '<span style="color:var(--red-stop)">Default</span>';
            };

            const buatDropdown = (dataList, idElement) => {
                if (!Array.isArray(dataList) || dataList.length === 0) return '<span style="color:#E53935">Default (Single)</span>';
                
                let html = `<select id="${idElement}" class="input-port" style="width: 100%; text-align: left; padding: 4px; cursor: pointer; background: #0A0A0A; border: 1px solid #333; color: var(--accent-orange); border-radius: 4px; outline: none; font-size: 11px;">`;
                dataList.forEach(item => {
                    const status = item.isDefault ? 'selected' : '';
                    html += `<option value="${item.folder}" ${status}>${item.folder} (${item.versi})</option>`;
                });
                html += `</select>`;
                return html;
            };

            const phpActive = getActiveVersion(versions.php);
            const mysqlActive = getActiveVersion(versions.mysql);
            const phpDropdown = buatDropdown(versions.php, 'selectPHP');
            const mysqlDropdown = buatDropdown(versions.mysql, 'selectDB');

            const currentCfg = await window.serverAPI.getSettings();
            const isPMADefault = currentCfg.db_manager === 'phpmyadmin' ? 'selected' : '';
            const isAdminerDefault = currentCfg.db_manager === 'adminer' ? 'selected' : '';
            const isMyDBDefault = currentCfg.db_manager === 'ngappidmydb' ? 'selected' : '';

            const dbManagerDropdown = `
                <select id="selectDBManager" class="input-port" style="width: 100%; text-align: left; padding: 4px; cursor: pointer; background: #0A0A0A; border: 1px solid #333; color: var(--accent-orange); border-radius: 4px; outline: none; font-size: 11px;">
                    <option value="ngappidmydb" ${isMyDBDefault}>NgAppID MyDB</option>
                    <option value="phpmyadmin" ${isPMADefault}>PHPMyAdmin</option>
                    <option value="adminer" ${isAdminerDefault}>Adminer</option>
                </select>
            `;
            const dbManagerActive = currentCfg.db_manager === 'ngappidmydb' ? 'NgMyDB' : (currentCfg.db_manager === 'phpmyadmin' ? 'PMA' : 'Adminer');
            
            modalTitle.innerText = '⚙️ App, Stack & Port Settings';
            modalBody.innerHTML = `
                <div style="font-size: 11px; color: var(--text-main); line-height: 1.6;">
                    
                    <b style="color: var(--accent-orange); font-size: 12px;">🔧 Komponen, Port & Versi</b>
                    <table style="width: 100%; border-collapse: collapse; margin-top: 5px; margin-bottom: 15px;">
                        <tr style="border-bottom: 1px solid #333; color: var(--text-muted);">
                            <th style="padding-bottom: 4px; width: 13%;">Komponen</th>
                            <th style="padding-bottom: 4px; width: 11%;">Port</th>
                            <th style="padding-bottom: 4px; width: 25%;">Default / Aktif</th>
                            <th style="padding-bottom: 4px; width: 28%;">Pilih Versi</th>
                            <th style="padding-bottom: 4px; width: 25%; text-align: center;">Download Link</th>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: var(--green-start);"><b>Nginx</b></td>
                            <td style="padding: 4px 4px 4px 0;text-align: center; font-family: monospace;"><input type="number" id="editPortWeb" value="${currentCfg.web_port || 80}" class="input-port" style="width: 40px; text-align: center; padding: 4px;"></td>
                            <td style="padding: 4px 0; font-family: monospace;">${versions.nginx}</td>
                            <td style="padding: 4px 0; color: var(--text-muted);"><i>Built-in</i></td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://nginx.org/en/download.html')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: var(--accent-orange);"><b>PHP</b></td>
                            <td style="padding: 4px 4px 4px 0;text-align: center; font-family: monospace;">-</td>
                            <td style="padding: 4px 0; font-family: monospace; color: #fff;">${phpActive}</td>
                            <td style="padding: 4px 0;">${phpDropdown}</td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://windows.php.net/download/')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: #00BCD4;"><b>Database</b></td>
                            <td style="padding: 4px 4px 4px 0;text-align: center; font-family: monospace;">-</td>
                            <td style="padding: 4px 0; font-family: monospace; color: #fff;">${mysqlActive}</td>
                            <td style="padding: 4px 0;">${mysqlDropdown}</td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://mariadb.org/download/')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: #8BC34A;"><b>MySQL</b></td>
                            <td style="padding: 4px 0; font-family: monospace;"><input type="number" id="editPortDB" value="${currentCfg.db_port || 3307}" class="input-port" style="width: 40px; text-align: center; padding: 4px;"></td>
                            <td style="padding: 4px 0; font-family: monospace; color: #fff;">${dbManagerActive}</td>
                            <td style="padding: 4px 0;">${dbManagerDropdown}</td>
                            <td style="padding: 4px 0; color: var(--text-muted); text-align: center;"><i>Built-in</i></td>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: #FF1500;"><b>PostgreSQL</b></td>
                            <td style="padding: 4px 0; font-family: monospace;"><input type="number" id="editPortPgSQL" value="${currentCfg.pgsql_port || 5432}" class="input-port" style="width: 40px; text-align: center; padding: 4px;"></td>
                            <td style="padding: 4px 0; font-family: monospace;">Latest</td>
                            <td style="padding: 4px 0; color: var(--text-muted);"><i>Built-in</i></td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://www.postgresql.org/')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                        <tr style="border-bottom: 1px dashed #222;">
                            <td style="padding: 4px 0; color: #F44336;"><b>Redis</b></td>
                            <td style="padding: 4px 4px 4px 0;text-align: center; font-family: monospace;">6379</td>
                            <td style="padding: 4px 0; font-family: monospace;">v5.0.14</td>
                            <td style="padding: 4px 0; color: var(--text-muted);"><i>Built-in</i></td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://github.com/microsoftarchive/redis/releases')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                        <tr>
                            <td style="padding: 4px 0; color: #E91E63;"><b>Mailpit</b></td>
                            <td style="padding: 4px 4px 4px 0;text-align: center; font-family: monospace;">8025</td>
                            <td style="padding: 4px 0; font-family: monospace;">Latest</td>
                            <td style="padding: 4px 0; color: var(--text-muted);"><i>Built-in</i></td>
                            <td style="padding: 4px 0; text-align: center;"><a href="#" onclick="window.serverAPI.openExternal('https://github.com/axllent/mailpit/releases')" style="color: var(--accent-orange); text-decoration: none;">🌐 Official</a></td>
                        </tr>
                    </table>


                </div>
                
                <div id="saveMsg" style="text-align: center; font-size: 11px; margin-top: 0px; font-weight: bold; height: 15px;"></div>
                
                <button id="btnSaveEngine" style="margin-top: 0px; width: 100%; background-color: var(--accent-orange); color: #121212; border:none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s;">💾 SIMPAN KONFIGURASI</button>
            `;

            document.getElementById('btnSaveEngine').addEventListener('click', async () => {
                const btn = document.getElementById('btnSaveEngine');
                const msg = document.getElementById('saveMsg');
                const selectPHP = document.getElementById('selectPHP');
                const selectDB = document.getElementById('selectDB');
                const selectDBManager = document.getElementById('selectDBManager'); 
                
                const phpBaru = selectPHP ? selectPHP.value : "php";
                const dbBaru = selectDB ? selectDB.value : "mariadb";
                const dbManagerBaru = selectDBManager ? selectDBManager.value : "ngappidmydb"; 
                
                // Ambil Nilai Port dari Form Settings
                const webPortVal = document.getElementById('editPortWeb').value || "80";
                const dbPortVal = document.getElementById('editPortDB').value || "3307";
                const pgsqlPortVal = document.getElementById('editPortPgSQL').value || "5432";
                
                btn.innerText = "⏳ MENYIMPAN...";
                btn.style.opacity = "0.7";

                const result = await window.serverAPI.saveSettings({ 
                    php: phpBaru, 
                    mysql: dbBaru,
                    web_port: webPortVal,
                    db_port: dbPortVal,
                    pgsql_port: pgsqlPortVal,
                    db_manager: dbManagerBaru 
                });
                
                if (result.success) {
                    // Update teks Dashboard UI langsung tanpa reload!
                    document.getElementById('portWeb').innerText = webPortVal;
                    document.getElementById('portDB').innerText = dbPortVal;
                    document.getElementById('portPgSQL').innerText = pgsqlPortVal;

                    const textPMA = document.getElementById('textDBManager');
                    if (textPMA) textPMA.innerText = (dbManagerBaru === 'ngappidmydb') ? 'NgMyDB' : (dbManagerBaru === 'phpmyadmin' ? 'PMA' : 'Adminer');

                    msg.innerText = "Konfigurasi berhasil diterapkan!";
                    msg.style.color = "var(--green-start)";
                    
                    btn.innerText = "✅ BERHASIL DISIMPAN!";
                    btn.style.backgroundColor = "var(--green-start)";
                    btn.style.color = "white";
                    btn.style.opacity = "1";
                    
                    setTimeout(() => {
                        modal.style.display = 'none';
                    }, 1500);
                } else {
                    msg.innerText = "❌ Gagal menyimpan!";
                    msg.style.color = "var(--red-stop)";
                    btn.innerText = "💾 COBA LAGI";
                    btn.style.opacity = "1";
                }
            });
        });
        
        document.getElementById('btnAbout').addEventListener('click', () => {
            modalTitle.innerText = '💡 About NgAppIDServ';
            document.querySelector('.modal-content').style.maxWidth = '80%';
            modalBody.innerHTML = `
                <div style="text-align:center;">
                    <h3 style="margin: 0; color: var(--accent-orange); border: none; padding: 0;">NgAppIDServ</h3>
                    <p style="font-size: 11px;">Local Web Server Modern & Cepat berbasis Golang (Wails).</p>
                    <div style="background: #1a1a1a; padding: 10px; border-radius: 6px; border-left: 3px solid var(--accent-orange); margin-top: 15px; text-align: left; font-size: 11px;">
                        <b>Dikembangkan oleh:</b><br>
                        👨‍💻 Author: Yedin (@YedinCoder)<br>
                        📧 Email: yedincoder@gmail.com<br>
                        🌐 Website: https://yedin.my.id<br>
                    </div>
                    
                    <!-- PESAN SPESIAL KELUARGA -->
                    <div style="margin-top: 15px; padding-top: 12px; border-top: 1px dashed #333; font-size: 11px; color: #aaa; font-style: italic; text-align: center; line-height: 1.6;">
                        <span style="color: var(--red-stop); font-size: 14px;">❤️</span><br>
                        Didedikasikan dengan penuh cinta untuk <b>Zawjatii</b>,<br>

       // --- LOGIKA TOMBOL PROJECT ---

        // --- LOGIKA TOMBOL ERROR LOGS ---
        document.getElementById('btnErrorLogs').addEventListener('click', () => {

            document.querySelector('.modal-content').style.maxWidth = '80%';
            modalBody.innerHTML = `
                <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px; line-height: 1.5; text-align: center;">

                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <button class="btn-outline-modal btn-open-log" data-log="nginx" style="border-color: #4CAF50; color: #4CAF50; padding: 10px;">🟢 Nginx Log</button>
                    <button class="btn-outline-modal btn-open-log" data-log="php" style="border-color: var(--accent-orange); color: var(--accent-orange); padding: 10px;">🟠 PHP Log</button>

                    <button class="btn-outline-modal btn-open-log" data-log="app" style="border-color: #E91E63; color: #E91E63; padding: 10px;">🔴 Crash Log</button>

            `;
            modal.style.display = 'flex';

            document.querySelectorAll('.btn-open-log').forEach(btn => {
                btn.addEventListener('click', function() {
                    const logType = this.getAttribute('data-log'); 
                    window.serverAPI.openLog(logType);
                    modal.style.display = 'none'; 
                });
            });
        });
        
        // --- FUNGSI MODAL KONFIRMASI HAPUS ---
        window.konfirmasiHapus = function(namaProject) {
            modalTitle.innerText = '🗑️ Konfirmasi Hapus Project';
            document.querySelector('.modal-content').style.maxWidth = '80%';
            modalBody.innerHTML = `
                <div style="margin-bottom: 20px; font-size: 13px; color: var(--text-main); line-height: 1.5;">
                    Apakah kamu yakin ingin menghapus project <b>${namaProject}</b>?<br><br>
                    <div style="background: #2a1111; padding: 10px; border-radius: 6px; border-left: 3px solid var(--red-stop); margin-top: 10px;">
                        <b style="color: var(--red-stop);">⚠️ PERINGATAN PERMANEN:</b><br>
                        Seluruh file di dalam folder <code>www/${namaProject}</code> akan <b>HANGUS</b> dan tidak bisa dikembalikan!
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button id="btnBatalHapus" class="btn-outline-modal" style="width: 50%; border-color: #888; color: #888;">Batal</button>
                    <button id="btnEksekusiHapus" style="width: 50%; background-color: var(--red-stop); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">🗑️ YA, HAPUS!</button>
                </div>
            `;
            
            document.getElementById('btnBatalHapus').addEventListener('click', () => {
                document.getElementById('btnOpenProject').click(); 
            });

            document.getElementById('btnEksekusiHapus').addEventListener('click', () => {
                modal.style.display = 'none'; 
                window.serverAPI.deleteProject(namaProject); 
            });
        };

        // --- LOGIKA TOMBOL AUTO INSTALLER ---
        document.getElementById('btnInstaller').addEventListener('click', () => {
            modalTitle.innerText = '📦 Auto Installer App';
            
            modalBody.innerHTML = `
                <div style="margin-bottom: 15px; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
                    Pilih platform yang ingin diunduh dan diinstal otomatis ke dalam folder <b>www</b> Anda:
                </div>
                
                <b style="color: var(--accent-orange); font-size: 12px;">🔥 PHP Frameworks</b>
                <div style="display:flex; gap:8px; margin: 8px 0 15px 0;">
                    <button class="btn-outline-modal btn-install-app" data-app="laravel" style="width: 50%; border-color: #F44336; color: #F44336; font-size: 11px;">Laravel</button>
                    <button class="btn-outline-modal btn-install-app" data-app="ci4" style="width: 50%; border-color: #FF9800; color: #FF9800; font-size: 11px;">CodeIgniter</button>
                </div>

                <b style="color: var(--accent-orange); font-size: 12px;">🌍 Content Management System (CMS)</b>
                <div style="display:flex; gap:8px; margin: 8px 0;">
                    <button class="btn-outline-modal btn-install-app" data-app="wordpress" style="width: 50%; border-color: #2196F3; color: #2196F3; font-size: 11px;">WordPress</button>
                    <button class="btn-outline-modal btn-install-app" data-app="joomla" style="width: 50%; border-color: #4CAF50; color: #4CAF50; font-size: 11px;">Joomla!</button>
                </div>
            `;
            
            modal.style.display = 'flex';

            document.querySelectorAll('.btn-install-app').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const appName = e.target.getAttribute('data-app');
                    
                    modalTitle.innerText = `⚙️ Setup Project ${appName.toUpperCase()}`;
                    modalBody.innerHTML = `
                        <div style="margin-bottom: 15px; font-size: 13px; color: var(--text-main);">
                            Masukkan nama folder untuk project <b>${appName.toUpperCase()}</b> kamu.<br>
                            <i style="font-size: 11px; color: var(--text-muted);">(Nama ini akan otomatis menjadi domain, misal: tokoku.test)</i>
                        </div>
                        <input type="text" id="inputProjectName" placeholder="Contoh: tokoku" style="width: 100%; padding: 10px; background: #0A0A0A; border: 1px solid #333; color: var(--accent-orange); border-radius: 4px; font-family: monospace; box-sizing: border-box; margin-bottom: 15px; outline: none;">
                        <button id="btnEksekusiInstall" style="width: 100%; background-color: var(--green-start); color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s;">🚀 INSTALL SEKARANG</button>
                    `;

                    document.getElementById('btnEksekusiInstall').addEventListener('click', () => {
                        let projectName = document.getElementById('inputProjectName').value.trim();
                        projectName = projectName.replace(/[^a-zA-Z0-9_-]/g, '').toLowerCase();
                        
                        if (!projectName) {
                            document.getElementById('inputProjectName').style.borderColor = "red";
                            return;
                        }
                        
                        modal.style.display = 'none'; 
                        window.serverAPI.installApp({ appName, projectName }); 
                    });
                });
            });
        });

        document.getElementById('btnCloseModal').addEventListener('click', () => {
            modal.style.display = 'none';
            document.querySelector('.modal-content').style.maxWidth = '320px';
        });

        document.getElementById('btnWebsite').addEventListener('click', () => {
            window.serverAPI.openExternal('https://dev.ngappid.com');
        });

        document.getElementById('btnMailpitLink').addEventListener('click', () => {
            window.serverAPI.openExternal('http://localhost:8025');
        });

        // --- LOGIKA SERVER UTAMA ---
        let state = { web: false, db: false, pgsql: false, redis: false, mail: false, tunnel: false };

        window.runtime.EventsOn("server-status", (data) => {
            const lampu = document.getElementById(data.id);
            const isRunning = (data.status === 'on');

            if (lampu) {
                isRunning ? lampu.classList.add('nyala') : lampu.classList.remove('nyala');

                if (data.id === 'lampuWeb') { state.web = isRunning; ubahTombol('btnTogglePHP', isRunning, 'PHP'); } 
                else if (data.id === 'lampuDB') { state.db = isRunning; ubahTombol('btnToggleDB', isRunning, 'MYSQL'); } 
                else if (data.id === 'lampuPgSQL') { state.pgsql = isRunning; ubahTombol('btnTogglePgSQL', isRunning, 'PGSQL'); }
                else if (data.id === 'lampuRedis') { state.redis = isRunning; ubahTombol('btnToggleRedis', isRunning, 'REDIS'); } 
                else if (data.id === 'lampuMail') { 
                    state.mail = isRunning; 
                    ubahTombol('btnToggleMail', isRunning, 'MAIL');
                    document.getElementById('btnMailpitLink').style.display = isRunning ? 'block' : 'none';
                } 
            }
        });

        window.runtime.EventsOn("server-log", (msg) => {
            const box = document.getElementById('statusBox');
            box.innerHTML += `<br>><span style="color:#aaa;"> ${msg}</span>`;
            box.scrollTop = box.scrollHeight;
        });

        // Pakai .innerText karena sekarang bentuknya <div> text mati, bukan form input lagi
        document.getElementById('btnTogglePHP').addEventListener('click', () => { 
            const port = document.getElementById('portWeb').innerText || 80;
            state.web ? window.serverAPI.stop() : window.serverAPI.start(port); 
        });
        
        document.getElementById('btnToggleDB').addEventListener('click', () => { 
            const port = document.getElementById('portDB').innerText || 3307;
            state.db ? window.serverAPI.stopDB() : window.serverAPI.startDB(port); 
        });
        document.getElementById('btnBackupDB').addEventListener('click', () => {
            const port = document.getElementById('portDB').innerText || 3307;
            window.serverAPI.backupDB(port);
        });
        document.getElementById('btnTogglePgSQL').addEventListener('click', () => { 
            const port = document.getElementById('portPgSQL').innerText || 5432;
            state.pgsql ? window.serverAPI.stopPgSQL() : window.serverAPI.startPgSQL(port); 
        });
        document.getElementById('btnToggleRedis').addEventListener('click', () => { state.redis ? window.serverAPI.stopRedis() : window.serverAPI.startRedis(); });
        document.getElementById('btnToggleMail').addEventListener('click', () => { state.mail ? window.serverAPI.stopMail() : window.serverAPI.startMail(); });
        
        
        document.getElementById('btnStopAll').addEventListener('click', () => { 
            window.serverAPI.stopAll(); 
            // Bikin Javascript lupa sama semua tunnel yang udah dibunuh Golang
            activeTunnels = {}; 
        });
        document.getElementById('btnOpenPMA').addEventListener('click', () => window.serverAPI.openPMA());
        document.getElementById('btnRebuildSSL').addEventListener('click', () => window.serverAPI.rebuildSSL());
        
        document.getElementById('btnConsoleMain').addEventListener('click', () => {
            window.serverAPI.openCmdWWW();
        });

        function ubahTombol(idTombol, isRunning, namaLayanan) {
            const btn = document.getElementById(idTombol);
            if (isRunning) {
                btn.textContent = 'STOP ' + namaLayanan;
                btn.className = 'btn-toggle btn-red';
            } else {
                btn.textContent = 'START ' + namaLayanan;
                btn.className = 'btn-toggle btn-green';
            }
        }

        // --- LOGIKA TOMBOL CEK UPDATE PINTAR ---
        document.getElementById('btnCheckUpdate').addEventListener('click', function() {
            const btn = this;
            if (!btn.classList.contains('ada-update')) {
                const box = document.getElementById('statusBox');
                box.innerHTML += `<br>><span style="color:#aaa;"> ✅ Udah versi terbaru bro, santai nggak perlu ngecek lagi.</span>`;
                box.scrollTop = box.scrollHeight;
                return; 
            }

            btn.innerHTML = `<span style="font-size: 12px;">↻</span> MENGECEK ULANG...`;
            btn.style.backgroundColor = '#555'; 
            btn.style.cursor = 'wait';

            window.serverAPI.checkUpdate();

            setTimeout(() => {
                if (btn.innerText.includes('MENGECEK')) {
                    btn.innerHTML = `<span style="font-size: 12px;">↻</span> UPDATE TERSEDIA`;
                    btn.style.backgroundColor = 'var(--red-stop)';
                    btn.classList.add('ada-update');
                    btn.style.cursor = 'pointer';
                }
            }, 5000);
        });


        // --- LOGIKA MODAL MULTI-TUNNEL ---
        let activeTunnels = {};

        document.getElementById('btnOpenTunnelModal').addEventListener('click', async () => {
            const projects = await window.serverAPI.getProjects(); 
            modalTitle.innerText = '🌐 Live Tunnel Manager';
            document.querySelector('.modal-content').style.maxWidth = '80%';
            
            let htmlList = '<div style="margin-bottom: 15px; font-size: 12px; color: var(--text-muted); line-height: 1.5; text-align: center;">Pilih project yang ingin di-online-kan (Public URL).</div>';
            htmlList += '<div style="display:flex; flex-direction:column; gap:8px; max-height: 300px; overflow-y: auto; padding-right: 5px;">';
            
            if (projects.length === 0) {
                htmlList += '<div style="text-align:center; color: var(--text-muted); margin-top: 15px;">Belum ada folder project di dalam folder <b>www</b>.</div>';
            } else {
                projects.forEach(p => {
                    // CEK MEMORI SEBELUM NAMPILIN TOMBOL
                    let actionButtons = '';
                    if (activeTunnels[p]) {
                        // Kalau di memori statusnya jalan, tampilkan tombol Link & Stop
                        actionButtons = `
                            <button onclick="window.serverAPI.openExternal('${activeTunnels[p]}')" class="btn-outline-modal" style="border-color: var(--accent-orange); color: var(--accent-orange); padding: 5px 10px; font-size: 11px;" title="Buka di Browser">🔗 Link</button>
                            <button onclick="putusTunnel('${p}')" class="btn-outline-modal" style="border-color: var(--red-stop); color: var(--red-stop); padding: 5px 10px; font-size: 11px;">⏹ Stop</button>
                        `;
                    } else {
                        // Kalau belum ada di memori, tampilkan tombol Konek
                        actionButtons = `
                            <button onclick="konekTunnel('${p}')" class="btn-outline-modal" style="border-color: #4CAF50; color: #4CAF50; padding: 5px 10px; font-size: 11px;">🚀 Konek</button>
                        `;
                    }

                    htmlList += `
                    <div style="display: flex; gap: 10px; align-items: center; justify-content: space-between; background: #0A0A0A; padding: 10px; border: 1px solid #333; border-radius: 6px;">
                        <span style="font-weight: bold; color: var(--accent-orange); font-size: 13px;">${p}.test</span>
                        <div id="tunnel-action-${p}" style="display: flex; gap: 5px;">
                            ${actionButtons}
                        </div>
                    </div>`;
                });
            }
            
            htmlList += '</div>';
            modalBody.innerHTML = htmlList;
            modal.style.display = 'flex';
        });

        // Fungsi saat klik tombol "Konek"
        window.konekTunnel = async function(projectName) {
            const actionDiv = document.getElementById(`tunnel-action-${projectName}`);
            // Pake innerText buat ngambil nilai portnya karena sekarang bentuknya text div
            const port = document.getElementById('portWeb').innerText || 80;
            
            // Ubah UI jadi loading
            actionDiv.innerHTML = `<span style="color: #aaa; font-size: 11px; padding: 5px;">⏳ Connecting...</span>`;
            
            try {
                const result = await window.serverAPI.startTunnel({ domain: projectName, port: port });
                
                if (result && result.success) {
                    // SIMPAN KE MEMORI PAS KONEK SUKSES
                    activeTunnels[projectName] = result.url;

                    actionDiv.innerHTML = `
                        <button onclick="window.serverAPI.openExternal('${result.url}')" class="btn-outline-modal" style="border-color: var(--accent-orange); color: var(--accent-orange); padding: 5px 10px; font-size: 11px;" title="Buka di Browser">🔗 Link</button>
                        <button onclick="putusTunnel('${projectName}')" class="btn-outline-modal" style="border-color: var(--red-stop); color: var(--red-stop); padding: 5px 10px; font-size: 11px;">⏹ Stop</button>
                    `;
                } else {
                    actionDiv.innerHTML = `
                        <span style="color: var(--red-stop); font-size: 11px; padding: 5px;">❌ Gagal</span>
                        <button onclick="konekTunnel('${projectName}')" class="btn-outline-modal" style="border-color: #888; color: #888; padding: 5px 10px; font-size: 11px;">Coba Lagi</button>
                    `;
                }
            } catch(e) {
                actionDiv.innerHTML = `<span style="color: var(--red-stop); font-size: 11px; padding: 5px;">❌ Error Server</span>`;
            }
        };

        // Fungsi saat klik tombol "Stop"
        window.putusTunnel = async function(projectName) {
            const actionDiv = document.getElementById(`tunnel-action-${projectName}`);
            actionDiv.innerHTML = `<span style="color: #aaa; font-size: 11px; padding: 5px;">⏳ Disconnecting...</span>`;
            
            await window.serverAPI.stopTunnel(projectName); 
            
            // HAPUS DARI MEMORI PAS DISTOP
            delete activeTunnels[projectName];
            
            // Kembalikan ke tombol Konek awal
            actionDiv.innerHTML = `
                <button onclick="konekTunnel('${projectName}')" class="btn-outline-modal" style="border-color: #4CAF50; color: #4CAF50; padding: 5px 10px; font-size: 11px;">🚀 Konek</button>
            `;
        };
    </script>
</body>
